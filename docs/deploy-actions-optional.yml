# 可选：改用 GitHub Actions 部署 Pages（而不是默认的「分支部署」）
#
# 本仓库默认已开启 Pages 的「分支部署」：push 到 main 后由 GitHub 直接发布根目录，
# 无需构建、无需 token 具备 workflow 权限。
#
# 如果你希望走 Actions（例如将来加入构建步骤），
# 把本文件复制为 .github/workflows/deploy.yml 再提交即可。
# 注意：含有 .github/workflows/ 的提交要求推送用的 token 具备 workflow 权限，
# 普通 repo 权限的 OAuth token 会被 GitHub 拒绝该文件的写入。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site
          cp -R index.html 404.html manifest.webmanifest .nojekyll assets models docs site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
