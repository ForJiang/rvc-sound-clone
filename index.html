<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RVC Sound Clone · 网页端声音克隆</title>
<meta name="description" content="基于 RVC（Retrieval-based Voice Conversion）的网页端声音克隆工具。纯静态部署，浏览器内推理，也可连接本地 RVC 服务获得最佳音质。" />
<meta name="keywords" content="RVC, 声音克隆, 语音转换, 变声器, AI 配音, WebAudio, ONNX" />
<meta name="author" content="ForJiang" />
<meta name="theme-color" content="#0b0f19" />
<meta property="og:type" content="website" />
<meta property="og:title" content="RVC Sound Clone · 网页端声音克隆" />
<meta property="og:description" content="基于 RVC 的网页端声音克隆工具：浏览器内推理，可静态部署，也可连接本地 RVC 服务。" />
<meta property="og:image" content="assets/logo.svg" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="apple-touch-icon" href="assets/logo.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<!-- 启动遮罩：模块加载完成后移除 -->
<div class="boot" id="boot">
  <div class="boot-logo">
    <img src="assets/logo.svg" alt="" width="56" height="56" />
  </div>
  <p class="boot-text" id="bootText">正在加载模型索引…</p>
  <div class="boot-bar"><span id="bootBar"></span></div>
</div>

<header class="topbar">
  <a class="brand" href="#/convert">
    <img class="brand-logo" src="assets/logo.svg" alt="" width="30" height="30" />
    <span class="brand-text">
      <strong><span class="grad-text">RVC</span> Sound Clone</strong>
      <small data-i18n="brand.tag">网页端声音克隆</small>
    </span>
  </a>

  <div class="engine-chip" id="engineChip" title="">
    <span class="dot" id="engineDot"></span>
    <span id="engineName" data-i18n="engine.unknown">未连接</span>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" id="langBtn" type="button" title="Language">EN</button>
    <button class="icon-btn" id="themeBtn" type="button" title="Theme">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12Zm0-15a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0V4a1 1 0 0 1 1-1Zm0 15a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0v-1a1 1 0 0 1 1-1ZM3 11h1a1 1 0 0 1 0 2H3a1 1 0 0 1 0-2Zm17 0h1a1 1 0 0 1 0 2h-1a1 1 0 0 1 0-2ZM5.6 4.2l.7.7a1 1 0 0 1-1.4 1.4l-.7-.7a1 1 0 0 1 1.4-1.4Zm12.1 12.1.7.7a1 1 0 0 1-1.4 1.4l-.7-.7a1 1 0 0 1 1.4-1.4ZM4.2 18.4l.7-.7a1 1 0 0 1 1.4 1.4l-.7.7a1 1 0 0 1-1.4-1.4ZM16.3 6.3l.7-.7a1 1 0 0 1 1.4 1.4l-.7.7a1 1 0 0 1-1.4-1.4Z"/></svg>
    </button>
    <a class="icon-btn" href="https://github.com/ForJiang/rvc-sound-clone" target="_blank" rel="noreferrer" title="GitHub">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.55v-1.94c-3.2.7-3.88-1.54-3.88-1.54-.52-1.34-1.28-1.7-1.28-1.7-1.05-.71.08-.7.08-.7 1.16.09 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.27.73-1.56-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.2-3.1-.13-.29-.52-1.46.1-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.75.81 1.2 1.84 1.2 3.1 0 4.43-2.7 5.4-5.26 5.68.42.36.79 1.07.79 2.16v3.2c0 .31.2.66.8.55A11.5 11.5 0 0 0 23.5 12A11.5 11.5 0 0 0 12 .5Z"/></svg>
    </a>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <a href="#/convert" data-route="convert">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-4 4.9V21h-2v-4.1A5 5 0 0 1 7 12h2a3 3 0 0 0 6 0h2Z"/></svg>
      <span data-i18n="nav.convert">声音转换</span>
    </a>
    <a href="#/models" data-route="models">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4V4Zm9 0h7v4h-7V4Zm0 6h7v10h-7V10ZM4 13h7v7H4v-7Z"/></svg>
      <span data-i18n="nav.models">模型库</span>
    </a>
    <a href="#/settings" data-route="settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8.4 4c0-.4 0-.8-.1-1.2l2-1.5-2-3.4-2.3 1a7.8 7.8 0 0 0-2-1.2L15.4 3h-3.8l-.6 2.5c-.7.3-1.4.7-2 1.2l-2.3-1-2 3.4 2 1.5c0 .4-.1.8-.1 1.2s0 .8.1 1.2l-2 1.5 2 3.4 2.3-1c.6.5 1.3.9 2 1.2l.6 2.5h3.8l.6-2.5c.7-.3 1.4-.7 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg>
      <span data-i18n="nav.settings">设置</span>
    </a>
    <a href="#/help" data-route="help">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 17h-2v-2h2v2Zm2.1-7.8-.9.9c-.7.7-1.2 1.3-1.2 2.9h-2v-.5c0-.9.4-1.7 1.1-2.4l1.2-1.3c.4-.3.6-.8.6-1.3a2 2 0 0 0-4 0H8a4 4 0 0 1 8 0c0 .9-.4 1.6-.9 2.7Z"/></svg>
      <span data-i18n="nav.help">使用帮助</span>
    </a>
    <div class="sidebar-foot">
      <span class="badge" data-i18n="nav.badge">v0.1.0 · 静态部署</span>
    </div>
  </nav>

  <main class="view" id="view" aria-live="polite">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal-root" id="modalRoot"></div>

<noscript>
  <div class="noscript">本工具需要在浏览器中启用 JavaScript。</div>
</noscript>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
