<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3c9d6"/>
    </linearGradient>
  </defs>
  <!-- 深色圆角底：与站点的玻璃/液态金属视觉一致 -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#0a0a0c"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- 三条音量柱：小尺寸下依然清晰可辨 -->
  <g fill="url(#ink)">
    <rect x="17" y="26" width="8" height="12" rx="4"/>
    <rect x="28" y="15" width="8" height="34" rx="4"/>
    <rect x="39" y="21" width="8" height="22" rx="4"/>
  </g>
</svg>
