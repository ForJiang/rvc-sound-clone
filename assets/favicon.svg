<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3c9d6"/>
    </linearGradient>
  </defs>
  <!-- 深色底：整幅填充不留透明角，避免标签页里透出标签栏颜色 -->
  <rect x="0" y="0" width="64" height="64" fill="#0a0a0c"/>
  <!-- 三条音量柱：小尺寸下依然清晰可辨 -->
  <g fill="url(#ink)">
    <rect x="17" y="26" width="8" height="12" rx="4"/>
    <rect x="28" y="15" width="8" height="34" rx="4"/>
    <rect x="39" y="21" width="8" height="22" rx="4"/>
  </g>
</svg>
